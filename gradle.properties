# Requires JDK 17 toolchain for Minecraft 1.20.1 / Forge 47 (see java.toolchain in build.gradle).
# Do not hardcode org.gradle.java.home: the foojay resolver provisions the toolchain,
# and a stale absolute path breaks the build on any other machine.
# Gradle 8.12 itself may run on JDK 17-23.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.20
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1
mod_id=network_tool_plus
mod_name=Network_tool plus
mod_license=GNU LGPL 3.0
mod_version=0.0.4
mod_group_id=org.chatterjay
mod_authors=Chatterjay
mod_description=Extends AE2's Network Tool with auto-collect: sneak+right-click to toggle enchanted collector mode, automatically pulls upgrade cards from inventory into the tool. 21 upgrade slots. Requires install on both client and server.

emi_version=1.1.23+1.20.1
ae2_version=15.4.5
ae2_version_range=[15.4,)